<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 75" width="100%" height="100%">
  <defs>
    <!-- Santander Red Gradients -->
    <linearGradient id="santanderRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E"/>
      <stop offset="50%" stop-color="#EC0000"/>
      <stop offset="100%" stop-color="#B80000"/>
    </linearGradient>
    <linearGradient id="wheelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes bikeRide {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-2px) rotate(-0.6deg); }
      50%      { transform: translateY(0px) rotate(0deg); }
      75%      { transform: translateY(-1.5px) rotate(0.4deg); }
    }
    @keyframes pedalCrank {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.45; }
      50%      { transform: scaleX(0.9); opacity: 0.25; }
    }
    @keyframes beamPulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 0.85; }
    }

    .bike-group {
      animation: bikeRide 1.1s ease-in-out infinite;
      transform-origin: 60px 52px;
    }
    .wheel-back {
      transform-origin: 25px 52px;
      animation: spinWheel 1.1s linear infinite;
    }
    .wheel-front {
      transform-origin: 95px 52px;
      animation: spinWheel 1.1s linear infinite;
    }
    .pedal-group {
      transform-origin: 55px 52px;
      animation: pedalCrank 1.1s linear infinite;
    }
    .bike-shadow {
      transform-origin: 60px 71px;
      animation: shadowPulse 1.1s ease-in-out infinite;
    }
    .headlight-beam {
      animation: beamPulse 1.8s ease-in-out infinite;
    }

    /* Hover Acceleration */
    svg:hover .wheel-back, svg:hover .wheel-front, svg:hover .pedal-group {
      animation-duration: 0.45s;
    }
    svg:hover .bike-group {
      animation-duration: 0.45s;
    }
  </style>

  <!-- Ground Road Shadow -->
  <ellipse class="bike-shadow" cx="60" cy="71" rx="48" ry="3.5" fill="#000000"/>

  <g class="bike-group">
    <!-- Front Headlight Beam -->
    <polygon class="headlight-beam" points="103,28 120,20 120,40" fill="url(#lightGlow)"/>

    <!-- REAR WHEEL (Center: 25, 52) -->
    <g class="wheel-back">
      <circle cx="25" cy="52" r="18" fill="none" stroke="#0F172A" stroke-width="4.5"/>
      <circle cx="25" cy="52" r="16.2" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <line x1="25" y1="36" x2="25" y2="68" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <line x1="9" y1="52" x2="41" y2="52" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <line x1="13.7" y1="40.7" x2="36.3" y2="63.3" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <line x1="13.7" y1="63.3" x2="36.3" y2="40.7" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <circle cx="25" cy="52" r="3.2" fill="#EC0000"/>
    </g>

    <!-- FRONT WHEEL (Center: 95, 52) -->
    <g class="wheel-front">
      <circle cx="95" cy="52" r="18" fill="none" stroke="#0F172A" stroke-width="4.5"/>
      <circle cx="95" cy="52" r="16.2" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <line x1="95" y1="36" x2="95" y2="68" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <line x1="79" y1="52" x2="111" y2="52" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <line x1="83.7" y1="40.7" x2="106.3" y2="63.3" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <line x1="83.7" y1="63.3" x2="106.3" y2="40.7" stroke="#94A3B8" stroke-width="0.85" opacity="0.8"/>
      <circle cx="95" cy="52" r="3.2" fill="#EC0000"/>
    </g>

    <!-- Mudguards -->
    <path d="M 9,50 A 19 19 0 0 1 36,35" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80,35 A 19 19 0 0 1 107,44" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

    <!-- SANTANDER FRAME (Iconic Red Step-Through) -->
    <!-- Rear chainstay -->
    <line x1="25" y1="52" x2="55" y2="52" stroke="url(#santanderRedGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Seatstay -->
    <line x1="25" y1="52" x2="44" y2="31" stroke="url(#santanderRedGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Seat tube -->
    <line x1="55" y1="52" x2="42" y2="28" stroke="url(#santanderRedGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Main Curved Down-tube -->
    <path d="M 44,32 Q 62,48 83,28" fill="none" stroke="url(#santanderRedGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Bottom Reinforcing Bar -->
    <line x1="55" y1="52" x2="83" y2="28" stroke="url(#santanderRedGrad)" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Front Fork & Steerer -->
    <line x1="83" y1="28" x2="95" y2="52" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="83" y1="28" x2="81" y2="18" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Handlebars -->
    <path d="M 76,18 Q 82,15 88,20" fill="none" stroke="#0F172A" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Santander Front Basket & Headlight -->
    <path d="M 86,22 L 99,22 L 97,31 L 87,31 Z" fill="#1E293B" stroke="#EC0000" stroke-width="1.2"/>
    <circle cx="101" cy="27" r="2.8" fill="#38BDF8"/>

    <!-- Saddle -->
    <path d="M 35,26 Q 43,23 50,26 Q 44,29 38,29 Z" fill="#0F172A"/>

    <!-- Chainring & Animated Pedals -->
    <circle cx="55" cy="52" r="5.5" fill="#334155" stroke="#EC0000" stroke-width="1.2"/>
    <g class="pedal-group">
      <line x1="55" y1="52" x2="55" y2="41" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="51" y="39" width="8" height="3" rx="1.5" fill="#EC0000"/>
      <line x1="55" y1="52" x2="55" y2="63" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="51" y="62" width="8" height="3" rx="1.5" fill="#EC0000"/>
    </g>
  </g>
</svg>
